syntax = "proto3";
package telemetry;

message SubscribeRequest {}

message AudioMetrics {
  double timestamp = 1;
  float  level     = 2;
}

message AnomalyEvent {
  double timestamp = 1;
  float  score     = 2;
}

message VideoFrame {
  double timestamp = 1;
  bytes  jpeg      = 2;
}

message TelemetryMessage {
  oneof payload {
    AudioMetrics audio = 1;
    AnomalyEvent event = 2;
    VideoFrame  frame = 3;
  }
}

service TelemetryService {
  rpc Subscribe(SubscribeRequest) returns (stream TelemetryMessage);
}
